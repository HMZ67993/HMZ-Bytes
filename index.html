       ['Can I use the apps in Arabic?','Yes. The apps switch between English and Arabic, with light and dark themes.'],
       ['Why can’t I buy some products yet?','Those apps are still in development. Their buy buttons turn on once they are published on Gumroad.']],
  fBio:'Independent desktop software by Hamza Mansour.',
  fPrivT:'Privacy',fPriv:'The apps process your files locally and do not upload them. This website collects no payment details.',
  fPayT:'Payments and refunds',fPay:'All payments, licenses and refunds are handled by Gumroad on hmzbytes.gumroad.com.'},
 ar:{lang:'English',store:'متجر Gumroad',nav:['المنتجات','الفيديوهات','عن HMZ-Bytes','الأسئلة'],

  heroA:'استعرض البرامج',heroB:'افتح متجر Gumroad',
  prodT:'البرامج',prodS:'متاح الآن وقادم قريباً. الشراء يتم عبر Gumroad.',
  vidT:'الفيديوهات',vidNone:'فيديوهات الشرح ستظهر هنا قريباً.',
  details:'التفاصيل',buy:'اشترِ عبر Gumroad',soon:'قريباً',live:'متاح',
  featT:'المميزات',noFeat:'ستضاف التفاصيل الكاملة عند الإطلاق.',shotT:'لقطات الشاشة',vidOne:'فيديو',
  aboutT:'عن HMZ-Bytes',
  aboutP:'مرحباً، أنا حمزة. أصمم تطبيقات ومنتجات رقمية توفر وقتك وتحافظ على أمان بياناتك. أدواتي مبنية على فكرة واحدة: أن تكون سهلة الاستخدام، وتعمل بدون إنترنت، ولا ترسل ملفاتك إلى أي مكان.',
  pillars:[['معالجة محلية','الملفات تُعالج على جهازك وليس على خادم.'],['عربي وإنجليزي','واجهات من اليمين لليسار ومن اليسار لليمين داخل البرامج.'],['دعم مباشر','عندك سؤال أو فكرة؟ راسلني عبر Gumroad.']],
  faqT:'الأسئلة الشائعة',
  faq:[['كيف أشتري؟','اضغط «اشترِ عبر Gumroad» على أي برنامج متاح. تدفع على Gumroad وتستلم رابط التحميل ومفتاح الترخيص هناك.'],
       ['هل تعمل البرامج بدون إنترنت؟','نعم. معالجة الملفات تتم على جهازك. الإنترنت مطلوب فقط للتحقق من الترخيص وتفعيله.'],
       ['هل البرامج بالعربي؟','نعم. البرامج تتبدل بين العربية والإنجليزية مع وضع فاتح وداكن.'],
       ['لماذا لا أستطيع شراء بعض البرامج؟','هذه البرامج ما زالت قيد التطوير. يعمل زر الشراء فور نشرها على Gumroad.']],
  fBio:'برمجيات مكتبية مستقلة من تطوير حمزة منصور.',
  fPrivT:'الخصوصية',fPriv:'البرامج تعالج ملفاتك محلياً ولا ترفعها. هذا الموقع لا يجمع أي بيانات دفع.',
  fPayT:'الدفع والاسترداد',fPay:'كل المدفوعات والتراخيص والاسترداد تتم عبر Gumroad على hmzbytes.gumroad.com.'}
};

let L = 'en';
try { L = localStorage.getItem('lang') || ((navigator.language||'').startsWith('ar') ? 'ar' : 'en'); } catch(e){}
const $ = id => document.getElementById(id);
const T = k => UI[L][k];

function badge(p){
  return p.status==='live'
   ? `<span class="px-2.5 py-1 rounded-full text-xs font-semibold bg-emerald-100 text-emerald-800">${T('live')}</span>`
   : `<span class="px-2.5 py-1 rounded-full text-xs font-semibold bg-sky-100 text-sky-800">${T('soon')}</span>`;
}
function buyBtn(p, cls){
  return p.status==='live' && p.url
   ? `<a href="${p.url}" target="_blank" rel="noopener" class="${cls} bg-sky hover:bg-sky/90 text-white text-center font-bold">${T('buy')}${p.price?` <span class="ltr">(${p.price})</span>`:''}</a>`
   : `<span class="${cls} bg-slate-100 text-slate-400 text-center font-semibold cursor-not-allowed">${T('soon')}</span>`;
}

function render(){
  document.documentElement.lang = L;
  document.documentElement.dir = L==='ar' ? 'rtl' : 'ltr';
  $('lang').textContent = T('lang'); $('storeBtn').textContent = T('store');
  $('nav').innerHTML = ['products','videos','about','faq'].map((h,i)=>`<a href="#${h}" class="hover:text-white">${T('nav')[i]}</a>`).join('');
  ['heroT','heroS','heroA','heroB','prodT','prodS','vidT','aboutT','aboutP','faqT','fBio','fPrivT','fPriv','fPayT','fPay'].forEach(k=>$(k).textContent=T(k));

  $('grid').innerHTML = PRODUCTS.map(p=>`
    <article class="bg-white rounded-2xl border border-slate-200 p-5 flex flex-col">
      <div class="flex items-center justify-between mb-3">${badge(p)}<span class="text-sm font-bold ltr">${p.price||''}</span></div>
      ${p.shots[0]?`<img src="${p.shots[0]}" alt="${p.n[L]}" loading="lazy" class="rounded-xl border border-slate-200 mb-3 w-full h-40 object-cover" onerror="this.remove()">`:''}
      <div class="flex items-center gap-3 mb-2">
        ${p.icon? `<img src="${p.icon}" alt="" loading="lazy" class="w-11 h-11 rounded-xl object-contain border border-slate-200 bg-white p-1" onerror="this.remove()">`:''}
        <h3 class="text-lg font-bold">${p.n[L]}</h3>
      </div>
      <p class="text-sm text-slate-600 mt-1 mb-5 flex-1">${p.t[L]}</p>
      <div class="flex gap-2">
        <button data-p="${p.id}" class="flex-1 px-3 py-2.5 rounded-xl bg-navy text-white text-sm font-semibold">${T('details')}</button>
        ${buyBtn(p,'flex-1 px-3 py-2.5 rounded-xl text-sm')}
      </div>
    </article>`).join('');

  $('vids').innerHTML = `
    <div class="md:col-span-2">
      <video id="brandVideo" class="w-full aspect-video rounded-xl border border-slate-200 bg-slate-900" controls playsinline preload="metadata" poster="${BRAND_VIDEO_POSTER}">
        <source src="${BRAND_VIDEO}" type="video/mp4">
        ${L==='ar'?'متصفحك لا يدعم تشغيل فيديو MP4.':'Your browser does not support MP4 video playback.'}
      </video>
      <p class="mt-2 font-semibold text-sm">${L==='ar'?'الفيديو التعريفي لـ HMZ-Bytes':'Meet HMZ-Bytes'}</p>
      <p id="videoFallback" class="hidden text-xs text-slate-500 mt-1">${L==='ar'?'سيظهر الفيديو هنا بعد رفع ملف assets/videos/hmzbytes-intro.mp4 إلى المستودع.':'The video will appear here after assets/videos/hmzbytes-intro.mp4 is uploaded to the repository.'}</p>
    </div>`;
  const brandVideo = $('brandVideo');
  if (brandVideo) brandVideo.addEventListener('error', () => $('videoFallback')?.classList.remove('hidden'));

  $('pillars').innerHTML = T('pillars').map(([a,b])=>`<div class="bg-white rounded-xl border border-slate-200 p-4"><h3 class="font-bold mb-1">${a}</h3><p class="text-sm text-slate-600">${b}</p></div>`).join('');
  $('faqList').innerHTML = T('faq').map(([q,a])=>`<details class="bg-slate-50 rounded-xl border border-slate-200 p-4"><summary class="font-semibold cursor-pointer">${q}</summary><p class="text-sm text-slate-600 mt-2">${a}</p></details>`).join('');
}

function openProduct(id){
  const p = PRODUCTS.find(x=>x.id===id); if(!p) return;
  $('mT').textContent = p.n[L];
  const feats = p.f[L].length ? `<ul class="space-y-2">${p.f[L].map(x=>`<li class="flex gap-2 text-sm"><span class="text-emerald-600 font-bold">✓</span><span>${x}</span></li>`).join('')}</ul>` : `<p class="text-sm text-slate-500">${T('noFeat')}</p>`;
  $('mB').innerHTML = `
    <div class="flex items-center gap-3">${badge(p)}<span class="font-bold ltr">${p.price||''}</span></div>
    <p class="text-slate-700">${p.t[L]}</p>
    ${p.yt?`<iframe class="w-full aspect-video rounded-xl" src="https://www.youtube.com/embed/${p.yt}" title="${T('vidOne')}" allowfullscreen></iframe>`:''}
    ${p.shots.length?`<div><h4 class="font-bold mb-2">${T('shotT')}</h4><div class="grid gap-3">${p.shots.map(s=>`<img src="${s}" alt="${p.n[L]}" loading="lazy" class="rounded-xl border border-slate-200 w-full" onerror="this.remove()">`).join('')}</div></div>`:''}
    <div><h4 class="font-bold mb-2">${T('featT')}</h4>${feats}</div>
    ${buyBtn(p,'block px-5 py-3 rounded-xl')}`;
  $('modal').classList.remove('hidden');
  document.body.style.overflow = 'hidden';
}
function closeModal(){ $('modal').classList.add('hidden'); document.body.style.overflow = ''; }

document.addEventListener('click', e=>{
  const b = e.target.closest('[data-p]'); if(b) openProduct(b.dataset.p);
  if(e.target.id==='modal') closeModal();
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeModal(); });
$('mX').addEventListener('click', closeModal);
$('lang').addEventListener('click', ()=>{ L = L==='en'?'ar':'en'; try{localStorage.setItem('lang',L)}catch(e){} render(); });
render();
</script>
</body>
</html>
